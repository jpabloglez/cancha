[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrations are auto-generated; tests may use long descriptive lines.
"*/migrations/*" = ["E501"]
# datetime.UTC (UP017) conflicts with the typeshed stubs version used in CI.
"ingestion/management/commands/db_check.py" = ["UP017"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
# Default discovery; tests not needing a DB run without one.
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
